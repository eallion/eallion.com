hero = true
heroStyle = "video" # hero 风格："pehe" (原版简约头像风格) | "dsh" (DeepSeek Harness 动态流体风格) | "image" (静态图片背景) | "video" (动态视频背景)
imageUrl = "https://api.eallion.com/bing?type=image" # heroStyle = "image" 时的背景图片地址
heroStyleFmt = "dogecloud" # heroStyle = "video" 时的视频格式："mp4" | "dogecloud"
videoURL = "/videos/hero-bg.mp4" # 当 heroStyleFmt = "mp4" 时的视频文件地址
heroStyleDogecloudUserId = 5123 # 多吉云用户 ID (可根据个人信息控制台填入，默认 1)
heroStyleDogecloudVcode = "c1e7ae0d02223b03" # 当 heroStyleFmt = "dogecloud" 时的多吉云视频 vcode (视频 ID)
# heroStyleDogecloudPlayToken = "" # 开启防盗链时的播放 Token（可选）
# heroStyleDogecloudVtype = 5 # 指定多吉云默认清晰度 ID（可选）

selection_category = "精选"
isoCode = "zh-cn"
rtl = false
dateFormat = "Jan 2, 2006"
logo = "/eallion.webp"
slogan = "Chance favors the prepared mind!"
slogan_hover = "机会总是垂青于有准备的人！"
preconnect = ["https://e.content-delivery-network.cn", "https://images.eallion.com"]
creativecommons = "by-sa"
startYear = 2006
copyright_name = "eallion.com"
icp = "浙ICP备16031768号-2"
description = 'Gemini, Millennials, Tiger, Normie, Kōjigen, N24SWD, AIWS, Upekkha. Geeker, Gamer, Blogger.'
keywords = ["Gemini", "Millennials", "Tiger", "Normie", "Kōjigen", "N24SWD", "AIWS", "Upekkha", "Geeker", "Gamer", "Blogger"]
mainSections = 'blog'
archiveSize = 0 # <- Set the desired number of posts per archive page

# 是否开启外链跳转提示
redirect = true
# 外链跳转白名单域名列表
safe_hosts = [
  "creativecommons.org",
  "*.e5n.cc",
  "*.eallion.com",
  "github.com",
  "gov.cn"
]

not_by_ai = true

# 是否全站显示作者信息
showAuthor = false

nonbot = "https://nonbot.org/pledged/view/9cefed7c-dc57-4832-84ec-197314fda979"

# Powered_by to set: | hugo | theme | full |
powered_by = "full"

# Save svg_title to 'assets/icons/title.svg'
svg_title = "eallion"

# Global Follow to set: | mastodon | newsletter |
follow = "mastodon"

# Mastodon handle (default fallback for follow section)
mastodonID = "@eallion@e5n.cc"

# 是否显示 Follow/Newsletter 区域
showFollow = false

# Default Feature Image
defaultFeature = "https://e.content-delivery-network.cn/ghost/content/images/custom/ce35a8bb-fbda-468c-9aa8-d3599e538566.jpg"

# OG Image URL (for social sharing cards, optional)
# If set, uses this API URL to generate OG images
# If not set, falls back to page image or defaultFeature
ogImageURL = "https://og.eallion.com/api/og?title="

# Comment system (giscus | waline | utterances | twikoo | disqus)
[comment]
  enable = true
  system = "twikoo"
  autoLoad = false
  linkRedirect = true

  [comment.giscus]
    repo = "eallion/eallion.com"
    repoID = "MDEwOlJlcG9zaXRvcnkyNjI2Njk1MDg="
    category = "Giscus"
    categoryID = "DIC_kwDOD6gExM4CS9eF"
    lang = "zh-CN"

  [comment.waline]
    serverURL = ""
    lang = "zh-CN"
    pageview = false
    version = "3.0.0"
    cdnCSS = ""
    cdnJS = ""

  [comment.utterances]
    repo = ""
    label = "comments"
    theme = "github-light"
    darkTheme = "github-dark"

  [comment.twikoo]
    envID = "twikoo.eallion.com"
    region = ""
    lang = "zh-CN"
    version = "1.7.11"
    cdn = "https://registry.npmmirror.com/twikoo/1.7.11/files/dist/twikoo.min.js"

  [comment.disqus]
    shortname = ""

