{{ define "main" }}

<link rel="preconnect" href="https://links.eallion.com" crossorigin>

{{- partial "content/breadcrumb.html" . -}}

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-0 md:mb-14" data-pagefind-ignore="all">

  <article class="md:col-span-2 prose lg:prose-lg dark:prose-invert">

    <header class="not-prose">

      <h1 id="title" class="text-4xl font-bold leading-normal">{{ .Title }}</h1>

    </header>

    <section class="flex flex-col max-w-full mt-0 md:mt-14 prose lg:flex-row dark:prose-invert">

      <div class="min-w-0 min-h-0 max-w-fit">

        <div id="content" class="prose lg:prose-lg dark:prose-invert w-full">

          {{ .Content }}

        </div>

      </div>

    </section>

  </article>

  <!-- Aside -->
  <aside class="md:col-span-1">
    <div class="lg:sticky lg:top-8 mb-13" data-pagefind-ignore="all">

      {{- partial "content/aside-banner.html" . -}}

    </div>
  </aside>
</div>

<div id="links"
  data-style="detailed"
  data-shuffle="true"
  data-columns="auto"
  data-show-switcher="true"
  data-show-unions="true"
  data-show-links="true"
  data-theme="auto"
  data-limit="0"
  class="min-h-40 w-full">
  <div class="flex items-center justify-center text-zinc-400 dark:text-text-dimmed-secondary text-sm gap-2">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: links-spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    <span>正在加载友情链接...</span>
  </div>
  <style>@keyframes links-spin { 100% { transform: rotate(360deg); } }</style>
</div>

<script src="https://links.eallion.com/js/embed.js" defer></script>

{{ $lazyloadJS := resources.Get "js/lazyload.iife.min.js" | fingerprint "sha256" }}
<script type="text/javascript" src="{{ $lazyloadJS.RelPermalink }}"
  integrity="{{ $lazyloadJS.Data.Integrity }}"></script>

<script>
  var lazyLoadInstance = new LazyLoad({
    // Your custom settings go here
  });
</script>

{{ end }}
